version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: 'monthly'
  versioning-strategy: increase-if-necessary
  open-pull-requests-limit: 3
  groups:
    all-dependencies:
      patterns:
        - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: 'monthly'
  open-pull-requests-limit: 3
  groups:
    all-dependencies:
      patterns:
        - '*'
